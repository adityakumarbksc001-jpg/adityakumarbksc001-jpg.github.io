<style>
:root{--sb:0px}
html,body{margin:0;height:100%;background:#0a0d11;overflow:hidden}
a{color:inherit;text-decoration:none}
svg{display:block}
#intro{position:fixed;inset:0;background:#0a0d11}
#aditya-hero{--g1:#fff;--g2:#d9946a;position:relative;width:100%;height:100%;min-height:360px;overflow:hidden;isolation:isolate;color:#f2f4f8;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#aditya-hero *{box-sizing:border-box;margin:0}
#aditya-hero .g{background:linear-gradient(180deg,var(--g1) 25%,var(--g2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#aditya-hero .ah-cv{position:absolute;inset:0;z-index:1}
#aditya-hero .ah-glow{position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,128,56,.30),rgba(245,128,56,.08) 40%,transparent 68%);opacity:0;z-index:0}
#aditya-hero .ah-mark{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3}
#aditya-hero .ah-dot{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#f98b3c,#ec6b1e);box-shadow:0 0 18px rgba(255,170,100,.6);opacity:0}
#aditya-hero .ah-stem{position:absolute;left:-6px;bottom:22px;width:12px;height:84px;border-radius:6px;background:linear-gradient(#ec6b1e,#f9b98a);transform-origin:50% 100%;transform:scaleY(0)}
#aditya-hero .ah-wrap{position:absolute;left:50%;top:50%;z-index:2;white-space:nowrap;transform:translate(-50%,-50%)}
#aditya-hero .ah-title{display:flex;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(44px,calc((100vw - var(--sb)) * .125),190px);line-height:1;letter-spacing:-.02em;padding:0 .04em}
#aditya-hero .ah-title{filter:drop-shadow(0 2px 14px rgba(0,0,0,.65))}
#aditya-hero .ah-title span{display:inline-block;opacity:0}
#aditya-hero .ah-sub{position:absolute;left:0;right:0;top:100%;margin-top:.6em;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:clamp(13px,1.3vw,19px);opacity:0}
#aditya-hero .ah-sub{text-shadow:0 1px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.7)}
#aditya-hero .ah-sub b{font-weight:500;color:#fff}
#aditya-hero .ah-sub i{font-weight:300;font-style:normal;color:#ffc9a3;letter-spacing:.04em;margin-left:.4em}
#aditya-hero .ah-sub a{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 22px;border:1px solid rgba(255,255,255,.7);border-radius:14px;color:#fff;font-size:14px;font-weight:500;transition:background .25s,border-color .25s}
#aditya-hero .ah-sub a:hover{background:linear-gradient(180deg,#f58038,#ea6a1f);border-color:#f9b98a}
#aditya-hero .ah-next{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.7);text-transform:uppercase;padding:6px 12px}
#aditya-hero .ah-next svg{width:16px;height:16px;margin:4px auto 0;stroke:#ee6a1f;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#aditya-hero a:focus-visible{outline:2px solid #f9b98a;outline-offset:3px}
</style></head><body>

  var cols=Math.floor(w/cell),rows=Math.floor(h/cell);
  var oc=document.createElement('canvas');oc.width=cols;oc.height=rows;
  var o=oc.getContext('2d',{willReadFrequently:true});o.imageSmoothingQuality='high';o.drawImage(img,0,0,cols,rows);
  var d=o.getImageData(0,0,cols,rows).data;P=[];
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var i=(r*cols+c)*4,l=(.3*d[i]+.59*d[i+1]+.11*d[i+2])/255;
    if(l<.025)continue;
    var f=Math.pow(Math.min(1,Math.max(0,(l-.02)/.85)),.9);
    P.push({tx:x0+c*cell,ty:y0+r*cell,dx:Math.random()*W,dy:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,dl:Math.random()*.45,ph:Math.random()*6.28,s:cell*.84,b:Math.min(1,f*(.86+Math.random()*.22))});
  }
  bx=[];for(var k=0;k<L;k++)bx.push(new Float32Array(P.length*3));
  stars=[];var ns=Math.round(W*H/2600);for(var s=0;s<ns;s++)stars.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2});
  return true;
}

/* warm-tinted greys so the portrait sits in the site's orange palette */
function frame(t){
  raf=requestAnimationFrame(frame);
  if(!vis||!W)return;
  tick(t);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  var a=S.dust;if(a<=0)return;
  mx+=(tmx-mx)*.06;my+=(tmy-my)*.06;
  ctx.fillStyle='#ffe9d6';ctx.globalAlpha=a*.45;ctx.beginPath();
  for(var j=0;j<stars.length;j++){var s=stars[j];s.x=(s.x+s.vx+W)%W;s.y=(s.y+s.vy+H)%H;ctx.rect(s.x,s.y,1.5,1.5)}
  ctx.fill();cnt.fill(0);var ts=t/900;
  for(var n=0;n<P.length;n++){
    var p=P[n];
    var e=Math.min(1,Math.max(0,(S.mix-p.dl)/.55));e=e*e*(3-2*e);
    p.dx=(p.dx+p.vx+W)%W;p.dy=(p.dy+p.vy+H)%H;
    var sw=Math.sin(e*Math.PI)*36;
    var x=p.dx+(p.tx+mx*10-p.dx)*e+Math.cos(p.ph)*sw,y=p.dy+(p.ty+my*8-p.dy)*e+Math.sin(p.ph)*sw,z=1.4+(p.s-1.4)*e;
    var v=.6+(p.b*(.93+.07*Math.sin(ts+p.ph*3))-.6)*e;
    var k=Math.min(L-1,Math.max(0,(v*L)|0)),q=bx[k],i=cnt[k]*3;
    q[i]=Math.round(x*dpr)/dpr;q[i+1]=Math.round(y*dpr)/dpr;q[i+2]=Math.max(1/dpr,Math.round(z*dpr)/dpr);cnt[k]++;
  }
  ctx.globalAlpha=a;
  for(var m=0;m<L;m++){
    var c=cnt[m];if(!c)continue;var qq=bx[m],g=255*(m+.5)/L;
    ctx.fillStyle='rgb('+Math.round(g)+','+Math.round(g*.93)+','+Math.round(g*.86)+')';ctx.beginPath();
    for(var u=0;u<c;u++)ctx.rect(qq[u*3],qq[u*3+1],qq[u*3+2],qq[u*3+2]);
    ctx.fill();
  }
}

/* ---------- tiny timeline (replaces GSAP so the strict security policy needs no outside script) ---------- */
var E={
  none:function(t){return t},
  p2in:function(t){return t*t},
  p2io:function(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2},
  p3out:function(t){return 1-Math.pow(1-t,3)},
  p3io:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},
  elastic:function(t){if(t<=0)return 0;if(t>=1)return 1;var p=.45,p2=p/(2*Math.PI)*Math.asin(1);return Math.pow(2,-10*t)*Math.sin((t-p2)*2*Math.PI/p)+1},
  back:function(t){t-=1;return t*t*(2.7*t+1.7)+1}
};
var st,tweens,clock,done,N=NAME.length,M=TITLE.length,mxl=Math.max(N,M),G='ABCDEFGHIJKLMNOPQRSTUVWXYZ',last=-1,rnd=[],finished=false;
function T(obj,to,start,dur,ease,from){tweens.push({o:obj,to:to,s:start,d:dur,e:E[ease||'none'],f:from||null,cap:null,done:false})}
function reset(){
  st={dot:{x:0,y:-H*.65,sx:1,sy:1,o:1},stem:{sy:0,r:0,o:1},glow:{o:0},wrap:{y:0},sub:{o:0},p:{v:0},
      L:[...Array(N)].map(function(){return {o:0,y:-160,r:(Math.random()*440-220),s:.3}})};
  S.dust=0;S.mix=0;tweens=[];finished=false;last=-1;
  title.innerHTML=NAME.split('').map(function(c){return '<span class="g">'+c+'</span>'}).join('');title.classList.remove('g');
  var d=st.dot;
  T(d,{y:0},.05,.35,'p2in');
  T(d,{sx:1.6,sy:.45},.4,.06,'none');
  T(d,{sx:1,sy:1},.46,.25,'elastic');
  T(st.glow,{o:1},.3,.4,'none');
  T(st.stem,{sy:1},.5,.3,'p3out');
  T(st.stem,{r:-55,sy:.5,o:0},.9,.4,'p2in');
  T(d,{x:Math.min(W*.2,260),y:H*.05},.95,.7,'p2io');
  T(d,{o:0},1.55,.2,'none');
  st.L.forEach(function(l,i){T(l,{o:1,y:0,r:0,s:1},.9+i*.07,.5,'back',{o:0,y:-160,r:l.r,s:.3})});
  T(st.p,{v:1},1.8,.7,'none');
  T(st.wrap,{y:H*.2},2.4,.7,'p3io');
  T(st.glow,{o:.1},2.4,.7,'none');
  T(st.sub,{o:1},2.8,.4,'none');
  T(S,{dust:1},2.3,.6,'none');
  T(S,{mix:1},2.8,1.2,'p3io');
  done=4.1;
  paint();
}
function paint(){
  var d=st.dot;
  dotEl.style.opacity=d.o;dotEl.style.transform='translate('+d.x+'px,'+d.y+'px) scale('+d.sx+','+d.sy+')';
  stemEl.style.opacity=st.stem.o;stemEl.style.transform='rotate('+st.stem.r+'deg) scaleY('+st.stem.sy+')';
  glowEl.style.opacity=st.glow.o;
  wrap.style.transform='translate(-50%,-50%) translateY('+st.wrap.y+'px)';
  subEl.style.opacity=st.sub.o;
  if(!finished){var sp=title.children;for(var i=0;i<sp.length&&i<st.L.length;i++){var l=st.L[i];sp[i].style.opacity=l.o;sp[i].style.transform='translateY('+l.y+'px) rotate('+l.r+'deg) scale('+l.s+')'}}
}
/* the title types out letter by letter: only ever the correct letters of TITLE */
function scramble(p){
  var n=p>=1?M:Math.max(1,Math.ceil(p*M));
  title.textContent=TITLE.slice(0,n);title.classList.add('g');
  if(p>=1)finished=true;
}
var t0=0;
function tick(now){
  if(!tweens||!tweens.length)return;
  if(!t0)t0=now;
  var t=(now-t0)/1000*SPEED;
  for(var i=0;i<tweens.length;i++){
    var w=tweens[i];if(w.done||t<w.s)continue;
    if(!w.cap){w.cap={};for(var k in w.to)w.cap[k]=(w.f&&k in w.f)?w.f[k]:w.o[k]}
    var p=Math.min(1,(t-w.s)/w.d),e=w.e(p);
    for(var key in w.to)w.o[key]=w.cap[key]+(w.to[key]-w.cap[key])*e;
    if(p>=1)w.done=true;
  }
  if(st.p.v>0&&!finished)scramble(st.p.v);
  paint();
  if(t>=done&&!tick.fired){tick.fired=true;hero.dispatchEvent(new CustomEvent('aditya-hero:done'))}
}

function start(){
  if(!ready||!build())return;
  tick.fired=false;t0=0;reset();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){t0=1;tick(1e9)}
}
img.onload=function(){ready=true;if(true)enter()};
img.src=PHOTO;
function enter(){vis=true;start();if(!raf)raf=requestAnimationFrame(frame)}

hero.addEventListener('pointermove',function(e){var r=hero.getBoundingClientRect();tmx=((e.clientX-r.left)/r.width-.5)*2;tmy=((e.clientY-r.top)/r.height-.5)*2});
var rt=0;
addEventListener('resize',function(){if(!vis)return;clearTimeout(rt);rt=setTimeout(function(){var fin=finished,keep=S.mix;build();if(fin){S.mix=keep}},150)});

})();</script>
